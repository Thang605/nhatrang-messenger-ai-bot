services:
  - type: web
    name: nhatrang-messenger-ai-bot
    runtime: node
    plan: free
    buildCommand: echo "No external build needed"
    startCommand: node server.js
    envVars:
      - key: FB_VERIFY_TOKEN
        value: nhatrang_xe_tour_verify_2026
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
